<head>

<title>NeuroSurge</title>

<style>
:root { color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05070b; color: #e8eef5;
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }

a { color: #ffe066; }

<body>
<main>
<h1>NeuroSurge</h1>
<p id="ns-msg">Opening the game&hellip; If nothing happens, <a id="ns-go" href="scene/example/index.html">start NeuroSurge</a>.</p>
<noscript><p>NeuroSurge needs JavaScript and WebGL&nbsp;2.</p></noscript>
</main>
<script>
(function () {
  var target = 'scene/example/index.html';
  if (location.protocol === 'file:') {
    document.getElementById('ns-msg').innerHTML = 'NeuroSurge must be served over http from this folder (opening the file directly cannot load the ' +
      'game modules). In a terminal in this folder run <code>node serve-local.mjs</code> and open the address it prints. ' +
      'See PLAYER-GUIDE.md.';
    return;
  }
  location.replace(target + location.search + location.hash);
})();
</script>
